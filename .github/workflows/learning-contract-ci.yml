name: Learning contract CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-contract:
    name: Node ${{ matrix.node }} focused contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.18.0
          - 22.21.1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify evidence and adjacent learning contracts
        run: node --test scripts/test_learning_manifest.mjs scripts/test_learning_evidence_contract.mjs scripts/test_preview_binding_isolation.mjs scripts/test_reading_identity.mjs scripts/test_study_guide_assessment.mjs scripts/test_study_guide_frontend.mjs
      - name: Verify authoritative lesson blueprint contracts
        run: npm run test:lesson-blueprints
      - name: Verify Reading API authority in local D1
        run: npm run test:reading
      - name: Verify dedicated precheck binding types
        run: npm run check:precheck-binding-types
      - name: Verify formal Web artifact authority
        run: |
          npm run build:release-site
          npm run check:release-site
          npm run check:artifact-manifest
