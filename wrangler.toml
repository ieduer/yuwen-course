name = "yuwen-course"
compatibility_date = "2026-05-12"
pages_build_output_dir = "site"

[[d1_databases]]
binding = "READING_DB"
database_name = "yuwen-reading-db-preview"
database_id = "39ed36d9-b3f3-40fd-933a-9a68a4066302"
migrations_dir = "migrations"

[[env.production.d1_databases]]
binding = "READING_DB"
database_name = "yuwen-reading-db"
database_id = "99c541e7-e70b-4584-b939-7e88a6dd68c5"
migrations_dir = "migrations"

[[env.production.services]]
binding = "USER_CENTER_EVIDENCE"
service = "bdfz-user-center"
entrypoint = "YuwenEvidenceIdentity"

[[env.production.services]]
binding = "APIS"
service = "apis"

[[env.production.queues.producers]]
binding = "LEARNING_EVIDENCE_QUEUE"
queue = "bdfz-learning-evidence-yw-v2"

[[env.production.services]]
binding = "PREVIEW_LOGS"
service = "yw-preview-logs"

# Pages bundles runtime vars from this file, not project API metadata.
[env.production.vars]
YW_DURABLE_EVALUATION_ENABLED = "true"
# One reviewed lost response: one additional call in the original job.
YW_EVALUATION_ONE_SHOT_MODE = "lost_reply"
YW_EVALUATION_ONE_SHOT_SHA256 = "45a97c53d2b61075d92a5502fda033e2b5c6e227af308ef5094082d7d29cb6a1"
YW_EVALUATION_ONE_SHOT_UNTIL = "2026-10-03T05:30:00.000Z"
