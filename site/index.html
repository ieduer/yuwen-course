<body>
  <div class="read-progress" aria-hidden="true"><span id="read-progress-bar"></span></div>

  <aside class="atlas" id="atlas" aria-label="教材目錄" aria-hidden="false">
    <header class="atlas-head">
      <div>
        <a class="atlas-brand" href="/" target="_blank" rel="noopener noreferrer">課文</a>
        <p id="atlas-status">正在整理教材</p>
      </div>
      <button class="icon-button atlas-close" id="atlas-close" type="button" aria-label="關閉教材目錄">×</button>
    </header>
    <label class="atlas-search">
      <span>搜尋</span>
      <input id="lesson-search" type="search" placeholder="課文、作者、單元" autocomplete="off">
    </label>
    <div class="book-switcher" id="book-switcher" aria-label="冊別"></div>
    <nav class="lesson-index" id="lesson-index" aria-live="polite"></nav>
    <footer class="atlas-foot">
      <span>我的閱讀</span>
      <strong id="atlas-progress">0 / 0</strong>
    </footer>
  </aside>
  <button class="atlas-scrim" id="atlas-scrim" type="button" aria-label="關閉教材目錄"></button>

  <header class="topbar">
    <button class="icon-button atlas-open" id="atlas-open" type="button" aria-label="打開教材目錄" aria-expanded="true"><span aria-hidden="true"><i></i><i></i><i></i></span></button>
    <a class="topbar-wordmark" href="/" target="_blank" rel="noopener noreferrer">課文</a>
    <div class="topbar-context" id="topbar-context">高中語文 · 五冊教材</div>
    <button class="mobile-tools-toggle" id="mobile-tools-toggle" type="button" aria-label="打開篇目工具" aria-expanded="false" aria-controls="topbar-actions"><span aria-hidden="true">•••</span></button>
    <nav class="topbar-actions" id="topbar-actions" aria-label="篇目工具">
      <a class="text-button atlas-link" href="genres.html" data-same-tab>文體</a>
      <a class="text-button atlas-link" href="books.html" data-same-tab>書目</a>
      <a class="text-button atlas-link" href="star.html" data-same-tab>星圖</a>
      <a class="text-button atlas-link insight-link" href="insights.html" data-same-tab>己身</a>
      <button class="text-button" id="page-open" type="button">原圖</button>
      <button class="text-button" id="resources-open" type="button">資料</button>
    </nav>
  </header>

  <main class="lesson-shell" id="lesson-shell">
    <header class="lesson-masthead" id="lesson-masthead">
      <div class="masthead-copy">
        <p class="masthead-path"><span id="masthead-volume">高中語文</span><i aria-hidden="true"></i><span id="masthead-position">篇目</span></p>
        <h1 id="lesson-title">課文</h1>
      </div>
      <div class="lesson-portraits" id="lesson-portraits" aria-label="人物視覺"></div>
    </header>

    <div class="study-layout">
      <article class="reading-column" id="reading-column" aria-label="課文正文">
        <section class="orientation" id="orientation" aria-labelledby="orientation-title">
          <div class="section-label">01 / 先找方向</div>
          <h2 id="orientation-title">起始</h2>
          <div id="orientation-content"></div>
        </section>

        <section class="textbook-text" id="textbook-text" aria-labelledby="textbook-title">
          <div class="section-head">
            <div>
              <div class="section-label">02 / 進入文本</div>
              <h2 id="textbook-title">細讀</h2>
            </div>
            <div class="reader-size" aria-label="正文閱讀工具">
              <button id="font-down" type="button" aria-label="縮小正文">A−</button>
              <span id="font-label">100%</span>
              <button id="font-up" type="button" aria-label="放大正文">A+</button>
              <button id="focus-button" type="button" aria-label="切換專注閱讀" aria-pressed="false">專注</button>
            </div>
          </div>
          <div class="text-flow" id="text-flow"></div>
        </section>

        <section class="classroom-materials" id="classroom-materials" aria-labelledby="materials-title">
          <div class="section-head">
            <div>
              <div class="section-label">03 / 打開材料</div>
              <h2 id="materials-title">延伸</h2>
            </div>
            <p id="materials-count">按內容去重後隨時可展示</p>
          </div>
          <div id="material-stream"></div>
        </section>

        <section class="learning-check" id="learning-check" aria-labelledby="check-title">
          <div class="section-head">
            <div>
              <div class="section-label">04 / 見效</div>
              <h2 id="check-title">見效</h2>
            </div>
          </div>
          <div class="check-stage" id="check-stage"></div>
        </section>

        <div class="mobile-mastery-anchor" id="mobile-mastery-anchor" aria-hidden="true"></div>

        <section class="lesson-chat" id="lesson-chat" aria-labelledby="lesson-chat-title">
          <div class="section-head">
            <div>
              <div class="section-label">05 / 同讀</div>
              <h2 id="lesson-chat-title">此刻同讀</h2>
            </div>
            <a href="https://chat.bdfz.net/#lobby" target="_blank" rel="noopener noreferrer">另頁打開 ↗</a>
          </div>
          <div class="lesson-chat-frame"><iframe id="lesson-chat-frame" src="about:blank" title="課文實時聊天" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe></div>
        </section>

        <section class="transfer-matrix" id="transfer-matrix" aria-labelledby="transfer-title">
          <div class="section-label">06 / 能力遷移</div>
          <h2 id="transfer-title">高考</h2>
          <div class="matrix-links" id="matrix-links"></div>
        </section>
      </article>

      <aside class="learning-rail" id="learning-rail" aria-label="本課掌握度">
        <button class="mastery-toggle" id="mastery-toggle" type="button" aria-expanded="true" aria-controls="mastery-panel">
          <span>本課掌握度</span>
          <strong><b id="mastery-value">0</b><small>%</small></strong>
          <i aria-hidden="true">收</i>
        </button>
        <div class="mastery-panel" id="mastery-panel">
          <div class="mastery-spectrum" id="mastery-spectrum" style="--mastery:0%" aria-hidden="true"><span></span></div>
          <ol class="checkpoint-list" id="checkpoint-list"></ol>
        </div>
      </aside>
    </div>
  </main>

  <button class="lexicon-scrim" id="lexicon-scrim" type="button" aria-label="關閉查詞"></button>
  <section class="lexicon-dock" id="lexicon-dock" aria-label="字詞查閱工具" aria-hidden="true">
    <header>
      <div>
        <span>你選中了</span>
        <strong id="selection-word">字詞</strong>
      </div>
      <div class="dock-actions">
        <a id="moe-external" href="https://dict.revised.moe.edu.tw/" target="_blank" rel="noopener noreferrer">教育部原頁 ↗</a>
        <button class="icon-button" id="lexicon-close" type="button" aria-label="關閉字詞工具">×</button>
      </div>
    </header>
    <div class="lexicon-switch" role="tablist" aria-label="字詞工具">
      <button class="active" type="button" data-lexicon="dict" role="tab" aria-selected="true">課文 · 館藏 · 教育部</button>
      <button type="button" data-lexicon="zitong" role="tab" aria-selected="false">字統</button>
    </div>
    <div class="lexicon-viewport"><iframe id="lexicon-frame" title="辭典查詢" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe></div>
  </section>

  <dialog class="page-dialog" id="page-dialog">
    <form method="dialog" class="dialog-bar">
      <div>
        <span>教材原圖校勘</span>
        <strong id="page-dialog-title">本課圖頁</strong>
      </div>
      <button class="icon-button" value="close" aria-label="關閉原圖">×</button>
    </form>
    <div class="page-stage">
      <button class="page-arrow" id="page-prev" type="button" aria-label="上一頁">‹</button>
      <figure>
        <img id="page-image" alt="教材原圖">
        <figcaption id="page-caption"></figcaption>
      </figure>
      <button class="page-arrow" id="page-next" type="button" aria-label="下一頁">›</button>
    </div>
    <div class="page-strip" id="page-strip"></div>
  </dialog>

  <dialog class="resource-dialog" id="resource-dialog">
    <form method="dialog" class="dialog-bar resource-dialog-bar">
      <div>
        <span>課堂投影</span>
        <strong id="resource-dialog-title">學習資料</strong>
      </div>
      <div>
        <a id="resource-external" href="#" target="_blank" rel="noreferrer">新頁打開</a>
        <button class="icon-button" value="close" aria-label="關閉資料">×</button>
      </div>
    </form>
    <iframe id="resource-frame" title="課堂資料預覽" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
