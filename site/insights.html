<body>
  <canvas id="insight-canvas" aria-label="個人閱讀星圖"></canvas>
  <div class="insight-tooltip" id="insight-tooltip" hidden></div>
  <header class="insight-nav">
    <a class="brand" href="./" target="_blank" rel="noopener noreferrer">課文</a>
    <nav><a href="genres.html" data-same-tab>文體圖譜</a><a href="books.html" data-same-tab>書目星圖</a><a class="active" href="insights.html" data-same-tab>己身</a><a href="./" target="_blank" rel="noopener noreferrer">返回課文</a></nav>

  <main>
    <header class="insight-hero">
      <p>個人 · 細讀 · 成長</p>
      <h1>我的閱讀圖<span>。</span></h1>
      <strong id="orbit-summary">尚無閱讀軌跡</strong>

        <header><div><span>01</span><h2>篇目價值</h2></div></header>
        <div id="value-chart" class="value-chart"></div>
      </article>
      <article class="mastery-panel">
        <header><div><span>02</span><h2>文體掌握度</h2></div></header>
        <div id="mastery-chart" class="mastery-chart"></div>
      </article>
      <article class="word-panel">
        <header><div><span>03</span><h2>新詞星群</h2></div></header>
        <div id="word-chart" class="word-chart"></div>
      </article>
    </section>
  </main>
  <dialog id="word-dialog"><form method="dialog"><button aria-label="關閉">×</button></form><span>新詞活用</span><h2 id="word-title"></h2><p id="word-creation"></p><a id="word-lesson" href="./" target="_blank" rel="noopener noreferrer">回到篇目 ↗</a></dialog>
