# Independent target: register and provision before its first production write.
name = "yw-evaluation-jobs"
main = "site/evaluation-scheduler.js"
compatibility_date = "2026-05-12"
workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *"]

[vars]
# Claiming starts only after the paired Pages/D1 release is accepted.
YW_BACKGROUND_EVALUATION_ENABLED = "false"
YW_EVALUATION_ALERTS_ENABLED = "false"
# One reviewed lost response: one additional call in the original job.
YW_EVALUATION_ONE_SHOT_MODE = "lost_reply"
YW_EVALUATION_ONE_SHOT_SHA256 = "45a97c53d2b61075d92a5502fda033e2b5c6e227af308ef5094082d7d29cb6a1"
YW_EVALUATION_ONE_SHOT_UNTIL = "2026-10-03T05:30:00.000Z"

[[d1_databases]]
binding = "READING_DB"
database_name = "yuwen-reading-db"
database_id = "99c541e7-e70b-4584-b939-7e88a6dd68c5"
migrations_dir = "migrations"

[[services]]
binding = "PULSE_ALERTS"
service = "pulse"
entrypoint = "PlatformErrorAlerts"

# Same source-scoped, read-only receipt contract already used by Pages.
[[services]]
binding = "USER_CENTER_EVIDENCE"
service = "bdfz-user-center"
entrypoint = "YuwenEvidenceIdentity"

[observability]
enabled = true
head_sampling_rate = 1
